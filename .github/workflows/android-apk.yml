name: Build LuminaPlan APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Flutter project source
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, io, lzma, tarfile
          from pathlib import Path

          source = Path('.luminaplan/source.tar.xz.b64').read_text()
          payload = lzma.decompress(base64.b64decode(source))
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:') as archive:
              for member in archive.getmembers():
                  dest = Path(member.name)
                  if not member.isfile() or dest.is_absolute() or '..' in dest.parts:
                      raise ValueError(f'Unsafe or unsupported source path: {member.name}')
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  with archive.extractfile(member) as data:
                      dest.write_bytes(data.read())
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org=com.luminaplan .

      - name: Remove autogenerated example test
        run: rm -f test/widget_test.dart

      - name: Configure Android permissions and icon
        run: python3 tool/prepare_android.py

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload Android installer
        uses: actions/upload-artifact@v4
        with:
          name: LuminaPlan-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "${APK}#LuminaPlan.apk" --clobber
          else
            gh release create latest "${APK}#LuminaPlan.apk" --title "LuminaPlan Android" --notes "APK do LuminaPlan: agenda, lancamentos financeiros e alertas. Versao inicial de testes." --latest
          fi

      - name: Publish unpacked Flutter sources
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore README.md analysis_options.yaml pubspec.yaml lib/ test/ tool/ assets/
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish complete LuminaPlan Flutter sources"
            git push origin HEAD:main
          fi
